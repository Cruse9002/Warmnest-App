name: warmnest
description: "WarmNest is a multi-screen Flutter app designed for mental wellness, offering a serene dark mode experience with pixel-perfect UI and intuitive navigation through guided exercises, a supportive chatbot, journaling, music therapy, and focus tools."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  audioplayers: ^5.2.1
  # google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
